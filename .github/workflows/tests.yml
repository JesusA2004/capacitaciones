name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # El hook post-autoload-dump corre `optimize:clear`: sin estas variables Laravel
    # intentaría limpiar el caché de base de datos sobre un SQLite que aún no existe.
    # Las variables de proceso tienen prioridad sobre .env; phpunit.xml fija las suyas.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    strategy:
      fail-fast: false
      matrix:
        # 8.4 es la versión de producción (docs/DEPLOY.md) y 8.3 el mínimo de composer.json.
        # 8.5 queda fuera: phpoffice/phpspreadsheet 1.30.5 del lock exige PHP < 8.5 y ningún
        # despliegue la usa. Agregarla requiere actualizar esa dependencia y probar exportaciones.
        php-version: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Run Frontend Type Analysis
        run: npm run types:check

      - name: Tests
        run: php artisan test
