# =============================================================================
# Reenvio de Nginx para Laravel Reverb (WebSocket de notificaciones en tiempo
# real, ver docs/PUSH_NOTIFICATIONS.md). Igual criterio que multimedia.conf:
# este archivo NO es un vhost completo, es el fragmento que se agrega dentro
# del bloque `server { ... }` existente del sitio (junto a `location /` que ya
# reenvia a PHP-FPM/Laravel).
#
# Requiere que `php artisan reverb:start --host=0.0.0.0 --port=8080` este
# corriendo como proceso supervisado (systemd/Supervisor, mismo patron que
# `queue:work`) en el mismo servidor. En .env de produccion:
#   REVERB_HOST=people.mr-lana.com
#   REVERB_PORT=443
#   REVERB_SCHEME=https
# (el cliente se conecta por wss:// al puerto 443 normal del sitio; Nginx es
# quien reenvia internamente al puerto 8080 de Reverb).
# =============================================================================

# -----------------------------------------------------------------------------
# IMPORTANTE: la pagina publica de descarga de la app movil (docs/APP_RELEASES.md)
# vive en Laravel bajo el mismo prefijo /app que usa el protocolo de Reverb
# (compatible con Pusher: el cliente WebSocket conecta a /app/{REVERB_APP_KEY}).
# Sin estos bloques, el `location /app/` de abajo capturaria tambien
# GET /app, /app/descargar y /app/versiones y los reenviaria a Reverb (puerto
# 8080) en vez de a PHP-FPM/Laravel, rompiendo la pagina de descarga en
# produccion. `location =` (match exacto) tiene prioridad sobre el prefijo
# `location /app/` sin importar el orden en el archivo, asi que esto es
# seguro: el WebSocket real de Reverb (/app/{key}, un solo segmento dinamico
# que nunca es literalmente "descargar" o "versiones") sigue cayendo en el
# bloque de abajo sin cambios.
# -----------------------------------------------------------------------------
location = /app {
    try_files $uri /index.php?$query_string;
}
location = /app/descargar {
    try_files $uri /index.php?$query_string;
}
location = /app/versiones {
    try_files $uri /index.php?$query_string;
}
location ~ ^/app/descargar/[^/]+$ {
    try_files $uri /index.php?$query_string;
}

location /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Conexiones de WebSocket viven mucho mas que un request HTTP normal.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location /apps/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
