; =============================================================================
; MR. LANA PEOPLE — worker de la cola GENERAL (trabajos pesados: PDF,
; extracción de documentos, migración de expedientes, video).
;
; Instalación (ver docs/DEPLOY.md, «Procesos supervisados»):
;   sudo cp deploy/supervisor/people-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Ajusta `directory`, la ruta del binario PHP (`which php`) y `user` si tu
; VPS difiere de /var/www/people + /usr/bin/php + www-data.
;
; Tiempos (deben ser coherentes entre sí):
;  - Job más largo: AplicarMigracionExpedientesJob = 7200 s (declara su
;    propio $timeout, que manda sobre --timeout). ProcesarVideoJob = 3600 s.
;  - --timeout=3600: límite para jobs que no declaran el suyo.
;  - DB_QUEUE_RETRY_AFTER (config/queue.php, por defecto 7260) SIEMPRE mayor
;    que el job más largo: si no, un job aún en curso se ejecutaría dos veces.
;  - stopwaitsecs: deja terminar el job en curso antes de matar el proceso
;    en un `supervisorctl restart` (un deploy no corta un PDF a la mitad).
;
; Las notificaciones NO van aquí: tienen su worker dedicado
; (people-notifications.conf) para no esperar detrás de un PDF.
; =============================================================================
[program:people-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/people
command=/usr/bin/php /var/www/people/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=3600 --max-time=3600 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/people/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3660
