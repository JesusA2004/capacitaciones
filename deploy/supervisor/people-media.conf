; =============================================================================
; MR. LANA PEOPLE — worker DEDICADO de video (conexión `media`, cola `media`).
; Convierte a HLS los videos subidos (App\Jobs\ProcesarVideoJob): el video de
; la Inducción institucional y la biblioteca multimedia.
;
; Instalación (ver docs/PROCESAMIENTO_VIDEO.md §6):
;   sudo cp deploy/supervisor/people-media.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status people-media:*
;
; Por qué aparte de people-worker / del worker `redis`:
;  - ProcesarVideoJob se encola SIEMPRE en config('media.cola') → conexión
;    `media` (driver database, tabla `jobs`), NO en QUEUE_CONNECTION. Un
;    `queue:work redis` o `queue:work database --queue=default` nunca lo toma.
;  - La conversión dura hasta 3600 s ($timeout del job): la conexión `media`
;    tiene retry_after = MEDIA_QUEUE_RETRY_AFTER (3700 s por defecto), SIEMPRE
;    mayor que --timeout; con retry_after=90 (redis por defecto) el mismo video
;    se relanzaría a la mitad cada 90 s.
;  - stopwaitsecs > timeout: un deploy no corta una conversión a la mitad.
;
; Requisitos: ffmpeg y ffprobe instalados (FFMPEG_BIN / FFPROBE_BIN en .env si
; no están en el PATH de www-data). Diagnóstico:
;   sudo -u www-data php artisan people:videos-pendientes
; =============================================================================
[program:people-media]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/people
command=/usr/bin/php /var/www/people/artisan queue:work media --queue=media --sleep=3 --tries=2 --timeout=3600 --max-time=3600 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/people/storage/logs/media-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3660
