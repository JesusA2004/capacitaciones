; =============================================================================
; MR. LANA PEOPLE — worker DEDICADO de avisos (cola `notifications`).
; Prioritario: notificación en base de datos (campana/bandeja de la app),
; broadcast de Reverb (tiempo real web) y push de Expo (App\Jobs\SendExpoPushJob).
;
; Instalación:
;   sudo cp deploy/supervisor/people-notifications.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Usa la conexión `notificaciones` de config/queue.php: misma tabla `jobs`,
; pero con retry_after corto (NOTIFICATIONS_QUEUE_RETRY_AFTER, 180 s), así
; un aviso atorado por un worker caído se reintenta en minutos.
;  - --timeout=60: un aviso/push nunca tarda más (Expo: timeout HTTP 10 s).
;  - Si este worker se detiene, los avisos NO se pierden: quedan en `jobs`
;    y salen en cuanto Supervisor lo levanta. `notificaciones:reconciliar`
;    (cada minuto, cron del scheduler) repone cualquier aviso que faltara.
; =============================================================================
[program:people-notifications]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/people
command=/usr/bin/php /var/www/people/artisan queue:work notificaciones --queue=notifications --sleep=1 --tries=3 --timeout=60 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/people/storage/logs/notifications-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=70
