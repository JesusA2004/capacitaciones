; =============================================================================
; MR. LANA PEOPLE — servidor WebSocket Laravel Reverb (tiempo real web).
;
; Instalación:
;   sudo cp deploy/supervisor/people-reverb.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Escucha SOLO en 127.0.0.1:8080: el público entra por Nginx (wss:// en el
; 443 del sitio) con deploy/nginx/reverb.conf, que reenvía /app/{key} y
; /apps/... a este puerto. Nada expone el 8080 a Internet.
;
; Reverb ≠ cola: este proceso mantiene los WebSocket; los avisos los
; produce el worker `people-notifications`. Se necesitan los dos. Si Reverb
; cae, la notificación en base de datos y el push siguen funcionando y la
; campana web se actualiza por consulta cada 30 s.
;
; Muchas pestañas abiertas = muchas conexiones: si llegara a faltar, sube
; `minfds` en la sección [supervisord] de /etc/supervisor/supervisord.conf.
; =============================================================================
[program:people-reverb]
process_name=%(program_name)s
directory=/var/www/people
command=/usr/bin/php /var/www/people/artisan reverb:start --host=127.0.0.1 --port=8080 --no-interaction
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/people/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=10
